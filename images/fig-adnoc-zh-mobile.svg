<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 749" width="420" height="749" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">ADNOC 協議：官方稿寫了什麼</title><desc id="d">結構圖：ADNOC、G42、OpenAI 三方簽下多年合作，共同開發決策智慧能力，使用 OpenAI Frontier，部署在 G42 於阿聯的主權 AI 基礎設施；首批應用是整場油田規劃與每一桶的價值；重大決策仍由人類專家監督；建立在 ADNOC 既有的 ENERGYai 上，並透過 Daybreak Blue 強化網路防禦。金額與時程未公開。資料：ADNOC 新聞稿。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45566a"/></marker></defs><rect x="0" y="0" width="420" height="749" rx="14" fill="#ffffff" stroke="#d3dae2"/><text x="24" y="42" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">ADNOC 協議：官方稿寫了什麼</tspan></text><rect x="30" y="66" width="108" height="46.4" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="84" y="93" font-size="17" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="84" dy="0">ADNOC</tspan></text><rect x="156" y="66" width="108" height="46.4" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="210" y="93" font-size="17" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="210" dy="0">G42</tspan></text><rect x="282" y="66" width="108" height="46.4" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="336" y="93" font-size="17" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="336" dy="0">OpenAI</tspan></text><path d="M210 126 L210 156" fill="none" stroke="#566678" stroke-width="2.4" marker-end="url(#ar)"/><rect x="30" y="166" width="360" height="96.7" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="210" y="200" font-size="20" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="210" dy="0">決策智慧能力</tspan></text><text x="210" y="225" font-size="15" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="210" dy="0">使用 OpenAI 