<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 659" width="420" height="659" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">AI 與能源互相回報：演講的主軸</title><desc id="d">示意圖：左邊能源業，長久以來供電給 AI；右邊 AI 業，奧特曼說現在輪到 AI 回報，協助能源業解決新材料、新渦輪設計、更好的營運等難題。能源業實際成效尚待與 ADNOC 合作的成果。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="659" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="44" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">AI 與能源互相回報：演講的主軸</tspan></text><rect x="60" y="70" width="300" height="84" rx="12" fill="#fffdf9" stroke="#6b665d" stroke-width="2"/><text x="210" y="104" font-size="20" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="210" dy="0">能源業</tspan></text><text x="210" y="130" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">供電給 AI</tspan></text><path d="M100 158 L100 214" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><text x="116" y="191" font-size="15" font-weight="400" fill="#5b5750" text-anchor="start"><tspan x="116" dy="0">長久以來：AI 需要能源（00:52）</tspan></text><rect x="60" y="224" width="300" height="84" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="210" y="258" font-size="20" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">AI 業</tspan></text><text x="210" y="284" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">協助能源業解題</tspan></text><path d="M320 368 L320 312" fill="none" stroke="#0b5c51" stroke-width="2.4" marker-end="url(#ar)"/><text x="304" y="345" font-size="15" font-weight="700" fill="#0b5c51" text-anchor="end"><tspan x="304" dy="0">現在：AI 回報能源（01:02）</tspan></text><text x="210" y="399" font-size="15" font-weight="400" fill="#5b5750" text-anchor="middle"><tspan x="210" dy="0">03:15 他舉的例子</tspan></text><rect x="90" y="412" width="240" height="44.4" rx="12" fill="#fffdf9" stroke="#0b5c51" stroke-width="2"/><text x="210" y="438" font-size="17" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">新材料</tspan></text><rect x="90" y="466.4" width="240" height="44.4" rx="12" fill="#fffdf9" stroke="#0b5c51" stroke-width="2"/><text x="210" y="492.4" font-size="17" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">新渦輪設計</tspan></text><rect x="90" y="520.8" width="240" height="44.4" rx="12" fill="#fffdf9" stroke="#0b5c51" stroke-width="2"/><text x="210" y="546.8" font-size="17" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">更好的營運</tspan></text><text x="210" y="607.2" font-size="18" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">實際成效尚待驗證，演講沒有舉出能源領域</tspan><tspan x="210" dy="24.84">的成果</tspan></text></svg>
