<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 582" width="870" height="582" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">ADNOC 協議：官方稿寫了什麼</title><desc id="d">結構圖：ADNOC、G42、OpenAI 三方簽下多年合作，共同開發決策智慧能力，使用 OpenAI Frontier，部署在 G42 於阿聯的主權 AI 基礎設施；首批應用是整場油田規劃與每一桶的價值；重大決策仍由人類專家監督；建立在 ADNOC 既有的 ENERGYai 上，並透過 Daybreak Blue 強化網路防禦。金額與時程未公開。資料：ADNOC 新聞稿。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45566a"/></marker></defs><rect x="0" y="0" width="870" height="582" rx="14" fill="#ffffff" stroke="#d3dae2"/><text x="30" y="46" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">ADNOC 協議：官方稿寫了什麼</tspan></text><rect x="125" y="90" width="180" height="54" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="215" y="122" font-size="20" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="215" dy="0">ADNOC</tspan></text><rect x="345" y="90" width="180" height="54" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="435" y="122" font-size="20" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="435" dy="0">G42</tspan></text><rect x="565" y="90" width="180" height="54" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="655" y="122" font-size="20" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="655" dy="0">OpenAI</tspan></text><path d="M215 146 L345 176" fill="none" stroke="#566678" stroke-width="2.4" marker-end="url(#ar)"/><path d="M435 146 L435 176" fill="none" stroke="#566678" stroke-width="2.4" marker-end="url(#ar)"/><path d="M655 146 L525 176" fill="none" stroke="#566678" stroke-width="2.4" marker-end="url(#ar)"/><rect x="155" y="182" width="560" height="78.4" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="435" y="217" font-size="21" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="435" dy="0">決策智慧能力</tspan></text><text x="435" y="243.2" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="435" dy="0">使用 OpenAI Frontier，部署在 G42 於阿聯的主權 AI 基礎設施</tspan></text><text x="435" y="290.4" font-size="16" font-weight="700" fill="#45566a" text-anchor="middle"><tspan x="435" dy="0">首批應用</tspan></text><rect x="30" y="316.4" width="270" height="110" rx="12" fill="#ffffff" stroke="#0a7a8c" stroke-width="2"/><text x="165" y="348.4" font-size="18" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="165" dy="0">整場油田規劃</tspan></text><text x="165" y="373" font-size="15" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="165" dy="0">地下、設施、經濟研究整合成一</tspan><tspan x="165" dy="20.7">個決策</tspan></text><rect x="314" y="316.4" width="270" height="110" rx="12" fill="#ffffff" stroke="#0a7a8c" stroke-width="2"/><text x="449" y="348.4" font-size="18" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="449" dy="0">每一桶的價值</tspan></text><text x="449" y="373" font-size="15" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="449" dy="0">生產、煉製、物流、銷售、交易串</tspan><tspan x="449" dy="20.7">成一條</tspan></text><path d="M355 264.4 L165 310.4" fill="none" stroke="#0a7a8c" stroke-width="2.4" marker-end="url(#ar)"/><path d="M515 264.4 L449 310.4" fill="none" stroke="#0a7a8c" stroke-width="2.4" marker-end="url(#ar)"/><rect x="602" y="316.4" width="238" height="56.8" rx="12" fill="#ffffff" stroke="#a8480d" stroke-width="2" stroke-dasharray="7 5"/><text x="721" y="340.4" font-size="16" font-weight="700" fill="#a8480d" text-anchor="middle"><tspan x="721" dy="0">人類專家監督</tspan></text><text x="721" y="362.6" font-size="13" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="721" dy="0">重大決策仍由人決定</tspan></text><rect x="602" y="381.2" width="238" height="56.8" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="721" y="405.2" font-size="16" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="721" dy="0">ENERGYai</tspan></text><text x="721" y="427.4" font-size="13" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="721" dy="0">ADNOC 既有的地下 AI 系統</tspan></text><rect x="602" y="446" width="238" height="56.8" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="721" y="470" font-size="16" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="721" dy="0">Daybreak Blue</tspan></text><text x="721" y="492.2" font-size="13" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="721" dy="0">強化網路防禦</tspan></text><text x="435" y="554.8" font-size="16" font-weight="400" fill="#45566a" text-anchor="middle"><tspan x="435" dy="0">金額與時程未公開　資料：ADNOC 新聞稿</tspan></text></svg>
