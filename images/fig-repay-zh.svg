<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 412" width="870" height="412" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">AI 與能源互相回報：演講的主軸</title><desc id="d">示意圖：左邊能源業，長久以來供電給 AI；右邊 AI 業，奧特曼說現在輪到 AI 回報，協助能源業解決新材料、新渦輪設計、更好的營運等難題。能源業實際成效尚待與 ADNOC 合作的成果。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45566a"/></marker></defs><rect x="0" y="0" width="870" height="412" rx="14" fill="#ffffff" stroke="#d3dae2"/><text x="30" y="46" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">AI 與能源互相回報：演講的主軸</tspan></text><rect x="60" y="100" width="230" height="96" rx="12" fill="#ffffff" stroke="#566678" stroke-width="2"/><text x="175" y="134" font-size="20" font-weight="700" fill="#566678" text-anchor="middle"><tspan x="175" dy="0">能源業</tspan></text><text x="175" y="160" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="175" dy="0">供電給 AI</tspan></text><rect x="580" y="100" width="230" height="96" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="695" y="134" font-size="20" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="695" dy="0">AI 業</tspan></text><text x="695" y="160" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="695" dy="0">協助能源業解題</tspan></text><path d="M296 130 L572 130" fill="none" stroke="#566678" stroke-width="2.4" marker-end="url(#ar)"/><text x="435" y="110" font-size="16" font-weight="400" fill="#45566a" text-anchor="middle"><tspan x="435" dy="0">長久以來：AI 需要能源（00:52）</tspan></text><path d="M572 170 L296 170" fill="none" stroke="#0a7a8c" stroke-width="2.4" marker-end="url(#ar)"/><text x="435" y="198" font-size="16" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="435" dy="0">現在：AI 回報能源（01:02）</tspan></text><text x="695" y="265" 