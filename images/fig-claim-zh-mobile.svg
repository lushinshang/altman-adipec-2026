<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 612" width="420" height="612" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">千禧年大獎難題：宣稱走到哪一步</title><desc id="d">時間線（間距不依比例）：9 月 1 日到 5 日約 88 小時，OpenAI 稱約一萬個 agent 運作；9 月 8 日 OpenAI 公布證明與 Lean 形式化，並表示不領獎金；9 月 11 日 Clay 聲明問題 apparently 已解，審查不趕時間；11 月 2 日奧特曼在 ADIPEC 說證明了第一個千禧年大獎難題。外力版本是否等同 Clay 原題仍有爭議。本文歸納。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="612" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="44" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">千禧年大獎難題：宣稱走到哪一步</tspan></text><text x="66" y="94" font-size="18" font-weight="700" fill="#0b5c51" text-anchor="start"><tspan x="66" dy="0">09-01 至 09-05</tspan></text><rect x="66" y="102" width="330" height="65.28" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="231" y="130" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="231" dy="0">約 88 小時，OpenAI 稱約一萬個並行 </tspan><tspan x="231" dy="22.08">agent</tspan></text><text x="66" y="211.28" font-size="18" font-weight="700" fill="#0b5c51" text-anchor="start"><tspan x="66" dy="0">09-08</tspan></text><rect x="66" y="219.28" width="330" height="65.28" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="231" y="247.28" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="231" dy="0">OpenAI 公布證明與 Lean 形式化，表示</tspan><tspan x="231" dy="22.08">不領獎金</tspan></text><text x="66" y="328.56" font-size="18" font-weight="700" fill="#1f5f99" text-anchor="start"><tspan x="66" dy="0">09-11</tspan></text><rect x="66" y="336.56" width="330" height="65.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="231" y="364.56" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="231" dy="0">Clay 聲明：問題 apparently 已解，審</tspan><tspan x="231" dy="22.08">查不趕時間</tspan></text><text x="66" y="445.84" font-size="18" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="66" dy="0">11-02</tspan></text><rect x="66" y="453.84" width="330" height="43.2" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="231" y="481.84" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="231" dy="0">奧特曼：「證明了第一個千禧年大獎難題」</tspan></text><line x1="40" y1="80" x2="40" y2="489.04" stroke="#6b665d" stroke-width="3"/><circle cx="40" cy="92" r="9" fill="#0b5c51"/><circle cx="40" cy="209.28" r="9" fill="#0b5c51"/><circle cx="40" cy="326.56" r="9" fill="#1f5f99"/><circle cx="40" cy="443.84" r="9" fill="#b3392b"/><text x="210" y="541.04" font-size="18" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">爭點：證明的是帶外力的版本，是否等同 </tspan><tspan x="210" dy="24.84">Clay 原題</tspan></text><text x="210" y="591.48" font-size="14" font-weight="400" fill="#5b5750" text-anchor="middle"><tspan x="210" dy="0">間距不依比例</tspan></text></svg>
