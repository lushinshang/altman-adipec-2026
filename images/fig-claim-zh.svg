<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 372" width="870" height="372" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">千禧年大獎難題：宣稱走到哪一步</title><desc id="d">時間線（間距不依比例）：9 月 1 日到 5 日約 88 小時，OpenAI 稱約一萬個 agent 運作；9 月 8 日 OpenAI 公布證明與 Lean 形式化，並表示不領獎金；9 月 11 日 Clay 聲明問題 apparently 已解，審查不趕時間；11 月 2 日奧特曼在 ADIPEC 說證明了第一個千禧年大獎難題。外力版本是否等同 Clay 原題仍有爭議。本文歸納。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#45566a"/></marker></defs><rect x="0" y="0" width="870" height="372" rx="14" fill="#ffffff" stroke="#d3dae2"/><text x="30" y="46" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">千禧年大獎難題：宣稱走到哪一步</tspan></text><line x1="30" y1="150" x2="840" y2="150" stroke="#566678" stroke-width="3"/><circle cx="110" cy="150" r="9" fill="#0a7a8c"/><text x="110" y="123" font-size="19" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="110" dy="0">09-01 至 09-05</tspan></text><rect x="24" y="178" width="182" height="91.36" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="115" y="208" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="115" dy="0">約 88 小時，</tspan><tspan x="115" dy="22.08">OpenAI 稱約一萬個</tspan><tspan x="115" dy="22.08">並行 agent</tspan></text><circle cx="330" cy="150" r="9" fill="#0a7a8c"/><text x="330" y="123" font-size="19" font-weight="700" fill="#0a7a8c" text-anchor="middle"><tspan x="330" dy="0">09-08</tspan></text><rect x="239" y="178" width="182" height="91.36" rx="12" fill="#dcf0f3" stroke="#0a7a8c" stroke-width="2"/><text x="330" y="208" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="330" dy="0">OpenAI 公布證明與 </tspan><tspan x="330" dy="22.08">Lean 形式化，表示</tspan><tspan x="330" dy="22.08">不領獎金</tspan></text><circle cx="550" cy="150" r="9" fill="#16314f"/><text x="550" y="123" font-size="19" font-weight="700" fill="#16314f" text-anchor="middle"><tspan x="550" dy="0">09-11</tspan></text><rect x="459" y="178" width="182" height="91.36" rx="12" fill="#e3eaf3" stroke="#16314f" stroke-width="2"/><text x="550" y="208" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="550" dy="0">Clay 聲明：問題 </tspan><tspan x="550" dy="22.08">apparently 已解，</tspan><tspan x="550" dy="22.08">審查不趕時間</tspan></text><circle cx="770" cy="150" r="9" fill="#a8480d"/><text x="770" y="123" font-size="19" font-weight="700" fill="#a8480d" text-anchor="middle"><tspan x="770" dy="0">11-02</tspan></text><rect x="664" y="178" width="182" height="69.28" rx="12" fill="#fbead8" stroke="#a8480d" stroke-width="2"/><text x="755" y="208" font-size="16" font-weight="400" fill="#0f1c2b" text-anchor="middle"><tspan x="755" dy="0">奧特曼：「證明了第</tspan><tspan x="755" dy="22.08">一個千禧年大獎難題」</tspan></text><text x="435" y="322.36" font-size="19" font-weight="700" fill="#a8480d" text-anchor="middle"><tspan x="435" dy="0">爭點：證明的是帶外力的版本，是否等同 Clay 原題</tspan></text><text x="435" y="350.16" font-size="14" font-weight="400" fill="#45566a" text-anchor="middle"><tspan x="435" dy="0">間距不依比例</tspan></text></svg>
